name: Fedora Crash Doctor CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-crash-doctor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check shell scripts without suppressions
        run: shellcheck ./*.sh
      - name: Check shell syntax
        run: for script in ./*.sh; do bash -n "$script"; done
      - name: Install Python test dependencies
        run: python3 -m pip install --user pytest PySide6
      - name: Python unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
